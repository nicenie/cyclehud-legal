<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeloLume · 隐私政策与支持</title>
<style>
  :root{
    --primary:#2F6B07;
    --lime:#A6FF2E;
    --lime-ink:#10200A;
    --ink:#1B2530;
    --ink-2:#4B5B6B;
    --ink-3:#5F6D7C;
    --line:#D3DBE4;
    --sunken:#EFF2F6;
    --surface:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--sunken);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}
  h1{font-size:24px;line-height:1.35;margin:0 0 8px;font-weight:700}
  h2{font-size:16px;margin:0 0 10px;font-weight:700}
  p{margin:0 0 12px}
  .meta{font-size:13px;color:var(--ink-3);margin:0}
  .tag{display:inline-block;font-size:12px;color:var(--ink-2);background:#E7ECF2;border-radius:999px;padding:3px 12px;margin-bottom:16px}
  .tag::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-right:6px;vertical-align:1px}
  .row{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
  a{color:var(--primary);text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:2px;text-underline-offset:3px}
  footer{font-size:13px;color:var(--ink-3);text-align:center;margin-top:32px}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <span class="tag">VeloLume</span>
    <h1>隐私政策与支持</h1>
    <p class="meta">Privacy Policy &amp; Support · 隱私權政策與支援 · プライバシーポリシーとサポート</p>
  </div>

  <div class="card">
    <h2>简体中文</h2>
    <div class="row">
      <a href="zh-Hans/privacy-policy.html">隐私政策</a>
      <a href="zh-Hans/support.html">支持</a>
    </div>
  </div>

  <div class="card">
    <h2>繁體中文</h2>
    <div class="row">
      <a href="zh-Hant/privacy-policy.html">隱私權政策</a>
      <a href="zh-Hant/support.html">支援</a>
    </div>
  </div>

  <div class="card">
    <h2>English</h2>
    <div class="row">
      <a href="en/privacy-policy.html">Privacy Policy</a>
      <a href="en/support.html">Support</a>
    </div>
  </div>

  <div class="card">
    <h2>日本語</h2>
    <div class="row">
      <a href="ja/privacy-policy.html">プライバシーポリシー</a>
      <a href="ja/support.html">サポート</a>
    </div>
  </div>

  <div class="card">
    <p class="meta">联系方式 / Contact：<a href="mailto:rankor@sina.com">rankor@sina.com</a></p>
  </div>

  <footer>VeloLume · 数据不离开这台设备</footer>
</div>
</body>
</html>
